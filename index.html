<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SonarGraph - Interactive Spotify Library Visualizer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Vis.js Network for Interactive Node-and-Edge Graphs -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            spotify: '#1DB954',
            spotifyHover: '#1ed760',
            darkbg: '#121212',
            cardbg: '#181818',
            panelbg: '#282828'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-cardbg px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-full bg-spotify flex items-center justify-center font-bold text-black text-lg">S</div>
      <h1 class="text-xl font-bold tracking-tight text-white">SonarGraph</h1>
      <span class="text-xs bg-slate-800 text-spotify px-2.5 py-0.5 rounded-full font-mono border border-spotify/30">Node Visualizer</span>
    </div>

    <div id="auth-section">
      <button id="login-btn" onclick="redirectToSpotifyAuth()" class="hidden bg-spotify hover:bg-spotifyHover text-black font-semibold px-5 py-2 rounded-full transition-all text-sm shadow-md">
        Connect Spotify
      </button>
      <div id="user-profile" class="hidden flex items-center space-x-3">
        <span id="user-name" class="text-sm font-medium text-slate-300"></span>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition">
          Disconnect
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col space-y-6">

    <!-- Top Action Panel -->
    <div class="bg-cardbg rounded-2xl p-5 border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-semibold text-white">Music Library Hierarchy</h2>
        <p class="text-sm text-slate-400">Visualize your Spotify playlists, artists, and library tracks as interactive nodes.</p>
      </div>
      
      <div class="flex items-center space-x-3">
        <button id="fetch-btn" onclick="loadLibraryGraph()" disabled class="bg-slate-800 opacity-50 text-slate-400 px-4 py-2 rounded-xl font-medium text-sm border border-slate-700 flex items-center space-x-2 transition">
          <span>Generate Graph</span>
        </button>
      </div>
    </div>

    <!-- Graph Canvas Container -->
    <div class="bg-cardbg rounded-2xl border border-slate-800 p-2 flex-1 min-h-[600px] relative overflow-hidden shadow-2xl">
      <div id="network" class="w-full h-[600px] rounded-xl"></div>
      
      <!-- Placeholder Overlay when not logged in -->
      <div id="placeholder" class="absolute inset-0 bg-darkbg/90 backdrop-blur-sm flex flex-col items-center justify-center space-y-4 text-center p-6 z-10">
        <div class="w-16 h-16 rounded-full bg-spotify/10 flex items-center justify-center text-spotify text-3xl">
          🕸️
        </div>
        <h3 class="text-xl font-bold text-white">Connect Your Music Account</h3>
        <p class="text-slate-400 max-w-md text-sm">
          Log in with Spotify to map your playlists and top tracks into a node-and-edge graph structure.
        </p>
        <button onclick="redirectToSpotifyAuth()" class="bg-spotify hover:bg-spotifyHover text-black font-bold px-6 py-2.5 rounded-full transition text-sm shadow-lg">
          Authenticate with Spotify PKCE
        </button>
      </div>
    </div>
  </main>

  <script>
    // Configuration
    const CLIENT_ID = '814007c8f08a460b8e0446c4643d4fc0';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPE = 'user-read-private playlist-read-private user-library-read';

    // PKCE Helper Functions
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode.apply(null, new Uint8Array(input)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    // Authorization Redirect
    async function redirectToSpotifyAuth() {
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      localStorage.setItem('pkce_code_verifier', codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: CLIENT_ID,
        scope: SCOPE,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    // Token Exchange
    async function exchangeCodeForToken(code) {
      const codeVerifier = localStorage.getItem('pkce_code_verifier');

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });

      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_access_token', data.access_token);
        window.history.replaceState({}, document.title, window.location.pathname);
        initSession();
      }
    }

    // App Initialization
    async function initSession() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (code) {
        await exchangeCodeForToken(code);
        return;
      }

      const token = localStorage.getItem('spotify_access_token');
      if (token) {
        document.getElementById('placeholder').classList.add('hidden');
        document.getElementById('login-btn').classList.add('hidden');
        document.getElementById('user-profile').classList.remove('hidden');
        
        const fetchBtn = document.getElementById('fetch-btn');
        fetchBtn.disabled = false;
        fetchBtn.classList.remove('opacity-50', 'bg-slate-800', 'text-slate-400');
        fetchBtn.classList.add('bg-spotify', 'hover:bg-spotifyHover', 'text-black', 'cursor-pointer');

        fetchUserProfile(token);
        loadLibraryGraph();
      } else {
        document.getElementById('login-btn').classList.remove('hidden');
      }
    }

    async function fetchUserProfile(token) {
      try {
        const res = await fetch('https://api.spotify.com/v1/me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const profile = await res.json();
        if (profile.display_name) {
          document.getElementById('user-name').textContent = profile.display_name;
        }
      } catch (err) {
        console.error("Profile fetch error:", err);
      }
    }

    // Node & Edge Graph Generator
    async function loadLibraryGraph() {
      const token = localStorage.getItem('spotify_access_token');
      if (!token) return;

      try {
        const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=12', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const playlists = data.items || [];

        const nodes = [{
          id: 'root',
          label: 'My Library',
          shape: 'ellipse',
          color: { background: '#1DB954', border: '#1ed760' },
          font: { color: '#ffffff', size: 20, bold: true }
        }];

        const edges = [];

        playlists.forEach((pl) => {
          if (!pl) return;
          nodes.push({
            id: pl.id,
            label: pl.name,
            shape: 'box',
            color: { background: '#181818', border: '#1DB954' },
            font: { color: '#1DB954', size: 14 }
          });

          edges.push({
            from: 'root',
            to: pl.id,
            color: { color: '#334155' }
          });
        });

        const container = document.getElementById('network');
        const graphData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
          physics: {
            barnesHut: { gravitationalConstant: -2000, centralGravity: 0.3, springLength: 95 }
          }
        };

        new vis.Network(container, graphData, options);

      } catch (err) {
        console.error("Graph build error:", err);
      }
    }

    function logout() {
      localStorage.removeItem('spotify_access_token');
      localStorage.removeItem('pkce_code_verifier');
      window.location.reload();
    }

    window.addEventListener('DOMContentLoaded', initSession);
  </script>
</body>
</html>
